[project]
name = "orchestratord"
description = "Extensible workflow orchestration daemon with pluggable actions and agent backends"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.13.0",
    # asyncpg 0.30/0.31 desync its `_top_xact` state from SQLAlchemy's
    # `_started` flag, so an `AsyncSession.commit()` can emit a SAVEPOINT
    # release instead of COMMIT and silently drop writes.  Pin to the last
    # known-good 0.29 line (SQLAlchemy issues #13241 and #13381).
    "asyncpg>=0.29.0,<0.30.0",
    "croniter>=6.2.4",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "psutil>=5.9",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # Phase 1 hard dependency for Peer Federation (DESIGN §7 R9):
    # RedisBackend fan-out, the peer event relay, and the SETNX nonce
    # guard. Modules import it lazily so non-peer paths keep working
    # without a running server.
    "redis>=5.0",
    "rich",
    "sqlalchemy>=2.0.0",
    "typer[all]>=0.12.0",
    # ASGI server for `orchestratord serve` (Phase 0, §5.5.1). `[standard]`
    # pulls in `websockets` (the /ws realtime endpoint) and `watchfiles`
    # (`--reload`), which the bare `uvicorn` extra does not.
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# IM Message Gateway channel adapters. ``gateway`` is the pure-stdlib
# webhook surface; app-based adapters use the dedicated extras below.
gateway = []
gateway-feishu = [
    "lark-oapi==1.7.0",
    "qrcode==7.4.2",
]
gateway-wechat = [
    "cryptography>=42.0.0",
]
gateway-all = [
    "orchestratord[gateway-feishu]",
    "orchestratord[gateway-wechat]",
]
backends = [
    "orchestratord-claude",
    "orchestratord-clawcodex",
    "orchestratord-codex",
    "orchestratord-dsh",
    "orchestratord-hermes",
    "orchestratord-opencode",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[project.scripts]
orchestratord = "orchestratord.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/orchestratord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestratord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Async fixtures (db_engine → client → db in tests/api/conftest.py) open
# asyncpg connections; pin their loop scope to the test loop so a connection
# is never shared across event loops (asyncpg pool loop-affinity hazard).
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
# ``scripts`` lets conftest.py import ``install_cli_shims`` without
# requiring an editable install. ``.`` (repo root) additionally makes
# ``scripts`` importable as a namespace package (e.g.
# ``from scripts.migrate_eventlog_to_db import migrate_file``).
# Per DESIGN_backend_cli_test_guard.md §3.2.
pythonpath = [
    "src",
    "scripts",
    ".",
]
# §9.3 test chimney (multica ``agentintegration`` build tag analogue):
# tests marked ``agentintegration`` exercise REAL user-installed agent
# CLIs and are deselected by default — CI must never resolve/execute
# them. Opt in explicitly with ``-m agentintegration`` (later ``-m``
# wins over this addopts value) plus ``ORCHESTRATORD_SKIP_CLI_GUARD=1``
# to lift the conftest PATH guard. The daemon's default CLI command
# list is locked by ``scripts/agent-cli-command-names.txt`` via
# ``tests/test_agent_cli_command_lock.py``.
addopts = "-m 'not agentintegration'"
markers = [
    "agentintegration: smoke-tests a real user-installed agent CLI (deselected by default; opt in with -m agentintegration)",
]

# Workspace source map: lets ``uv pip install -e .[backends]`` resolve
# the backend packages to the in-tree paths under ``backends/`` instead
# of attempting to fetch them from the public PyPI registry. This is
# what enables Scheme D's drift detector to install every backend
# in one command.
[tool.uv.sources]
orchestratord-claude     = { path = "backends/orchestratord-claude",     editable = true }
orchestratord-clawcodex  = { path = "backends/orchestratord-clawcodex",  editable = true }
orchestratord-codex      = { path = "backends/orchestratord-codex",      editable = true }
orchestratord-dsh        = { path = "backends/orchestratord-dsh",        editable = true }
orchestratord-hermes     = { path = "backends/orchestratord-hermes",     editable = true }
orchestratord-opencode   = { path = "backends/orchestratord-opencode",   editable = true }
