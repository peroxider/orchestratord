[project]
name = "orchestratord"
description = "Issue-to-PR orchestration daemon over pluggable agent backends"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich",
    "typer[all]>=0.12.0",
]

[project.optional-dependencies]
backends = [
    "orchestratord-clawcodex",
    "orchestratord-codex",
    "orchestratord-dsh",
    "orchestratord-hermes",
    "orchestratord-opencode",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[project.scripts]
orchestratord = "orchestratord.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/orchestratord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestratord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
# ``scripts`` lets conftest.py import ``install_cli_shims`` without
# requiring an editable install.
# Per DESIGN_backend_cli_test_guard.md §3.2.
pythonpath = [
    "src",
    "scripts",
]

# Workspace source map: lets ``uv pip install -e .[backends]`` resolve
# the backend packages to the in-tree paths under ``backends/`` instead
# of attempting to fetch them from the public PyPI registry. This is
# what enables Scheme D's drift detector to install every backend
# in one command.
[tool.uv.sources]
orchestratord-clawcodex  = { path = "backends/orchestratord-clawcodex",  editable = true }
orchestratord-codex      = { path = "backends/orchestratord-codex",      editable = true }
orchestratord-dsh        = { path = "backends/orchestratord-dsh",        editable = true }
orchestratord-hermes     = { path = "backends/orchestratord-hermes",     editable = true }
orchestratord-opencode   = { path = "backends/orchestratord-opencode",   editable = true }
