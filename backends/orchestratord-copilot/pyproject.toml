[project]
name = "orchestratord-copilot"
version = "0.1.0"
description = "GitHub Copilot CLI backend for orchestratord"
requires-python = ">=3.11"
dependencies = [
    "orchestratord",
]

[project.entry-points."orchestratord.backends"]
copilot = "orchestratord_copilot:CopilotBackend"

[project.entry-points."orchestratord.backend_descriptors"]
copilot = "orchestratord_copilot.descriptor:COPILOT_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"