[project]
name = "orchestratord-openclaw"
version = "0.1.0"
description = "OpenClaw CLI backend for orchestratord"
requires-python = ">=3.11"
dependencies = [
    "orchestratord",
]

[project.entry-points."orchestratord.backends"]
openclaw = "orchestratord_openclaw:OpenclawBackend"

[project.entry-points."orchestratord.backend_descriptors"]
openclaw = "orchestratord_openclaw.descriptor:OPENCLAW_DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
