[alembic]
# Section 6.1: use an application-specific version table so a shared database's
# own migration ledger remains untouched. Conditional-skipped migrations are
# recorded here too. The URL is a placeholder; offline `--sql` rendering never
# opens a connection; a real DATABASE_URL is injected at deploy time.
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = postgresql://orchestratord:orchestratord@localhost:5432/orchestratord
version_table = orchestratord_schema_migrations
